server:
  port: 0   # Port aléatoire pour les instances dev (utile pour Load Balancer)
spring:
  application:
    name: recommendation-service

  datasource:
    url: jdbc:h2:mem:recommendationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


# ============================================
# 🔹 PROFIL DE PRODUCTION (MySQL)
# ============================================

---
spring:
  config:
    activate:
      on-profile: prod  # Active ce bloc quand on lance avec -Dspring.profiles.active=prod

  datasource:
    url: jdbc:mysql://localhost:3306/recommendationdb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9093   # Port fixe pour la prod
