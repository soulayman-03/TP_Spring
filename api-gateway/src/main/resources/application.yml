server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ? Route vers Authorization Service
        - id: authorization-service
          uri: lb://authorization-service
          predicates:
            - Path=/auth/**
          filters:
            - AuthorizationFilter

        # ? Route vers Product Composite Service
        - id: product-composite-service
          uri: lb://product-composite-service
          predicates:
            - Path=/product-composite/**
          filters:
            - AuthorizationFilter

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


